name: Stock buy signals

on:
  schedule:
    # Every 30 min, Mon-Fri, 13:30-20:00 UTC (~US market hours incl. pre/post buffer)
    - cron: "*/30 13-20 * * 1-5"
  workflow_dispatch: {}  # lets you trigger a run manually from the Actions tab

permissions:
  contents: write  # needed to commit the updated data/state.json back

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run signal scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MIN_BUY_VOTES: "3"
        run: python -m bot.main

      - name: Commit updated signal state
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add data/state.json data/positions.json
          git diff --cached --quiet || git commit -m "Update signal state [skip ci]"
          git push

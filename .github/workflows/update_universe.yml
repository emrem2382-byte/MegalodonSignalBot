name: Update ticker universe

on:
  schedule:
    - cron: "0 6 * * 1"  # every Monday 06:00 UTC
  workflow_dispatch: {}  # trigger manually any time from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh config/tickers.txt from S&P 500 + Nasdaq-100
        run: python -m scripts.update_universe

      - name: Commit updated ticker list
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add config/tickers.txt
          git diff --cached --quiet || git commit -m "Refresh ticker universe [skip ci]"
          git push
